<!doctype html>
<html data-theme="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Lede{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="app-shell">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-wordmark">Lede</div>

      <nav class="sidebar-nav">
        <a href="/" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          Dashboard
        </a>
        <a href="/archive" class="nav-item {% if active_page == 'archive' %}active{% endif %}">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 5h12M2 5V13a1 1 0 001 1h10a1 1 0 001-1V5M2 5V4a1 1 0 011-1h10a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M6 8h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Archive
        </a>
        <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="2.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 1v2M8 13v2M1 8h2M13 8h2M2.93 2.93l1.41 1.41M11.66 11.66l1.41 1.41M2.93 13.07l1.41-1.41M11.66 4.34l1.41-1.41" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-toggle-btn">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.3"/>
            <path d="M7 1v1.5M7 11.5V13M1 7h1.5M11.5 7H13M2.5 2.5l1 1M10.5 10.5l1 1M2.5 11.5l1-1M10.5 3.5l1-1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Dark mode
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main-content {% block main_class %}{% endblock %}" id="main-content">
      {% block content %}{% endblock %}
    </main>

  </div><!-- .app-shell -->

  {% block audio_bar %}{% endblock %}

  <script>
    // Theme toggle
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', isDark ? 'light' : 'dark');
      document.getElementById('theme-toggle-btn').childNodes[2].nodeValue = isDark ? ' Dark mode' : ' Light mode';
      localStorage.setItem('lede-theme', isDark ? 'light' : 'dark');
    }
    // Restore saved theme
    (function() {
      const saved = localStorage.getItem('lede-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
        const btn = document.getElementById('theme-toggle-btn');
        if (btn && saved === 'dark') {
          btn.childNodes[2].nodeValue = ' Light mode';
        }
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
